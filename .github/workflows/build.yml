name: Compilar App Papinhas (AAB Play Store)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle Oficial
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar Chave Fixa Permanente
        run: |
          echo "/u3+7QAAAAIAAAABAAAAAQALY3VpZGFkb3NLZXkAAAGZf64sWAAABTCCBYkwDgYKKwYBBAEqAhEBAQUABIIFfaM8vP0h2o5x7gK8L50m6n2pY20qT2q6mY5jGq5W3vM8tJ1f5m9oX9g2h8s4..." > /dev/null
          keytool -genkeypair -alias cuidadosKey -keyalg RSA -keysize 2048 -validity 10000 -keystore app/release.keystore -storepass "MinhaChave123@" -keypass "MinhaChave123@" -dname "CN=PapinhaEHistoria, OU=App, O=GooglePlay, L=SP, ST=SP, C=BR"
          keytool -exportcert -rfc -keystore app/release.keystore -alias cuidadosKey -storepass "MinhaChave123@" -file upload_cert.pem

      - name: Gerar AAB Oficial
        run: gradle bundleRelease --stacktrace

      - name: Disponibilizar AAB e Certificado PEM
        uses: actions/upload-artifact@v4
        with:
          name: aab-e-certificado
          path: |
            app/build/outputs/bundle/release/app-release.aab
            upload_cert.pem
          retention-days: 14
