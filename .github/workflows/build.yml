name: Compilar App Papinhas (AAB Play Store)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle Oficial
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar Chave Fixa de Release
        run: |
          keytool -genkeypair -alias cuidadosKey -keyalg RSA -keysize 2048 -validity 10000 -keystore app/release.keystore -storepass "MinhaChave123@" -keypass "MinhaChave123@" -dname "CN=CuidadosDoBebe, OU=App, O=GooglePlay, L=SaoPaulo, ST=SP, C=BR"
          keytool -exportcert -rfc -keystore app/release.keystore -alias cuidadosKey -storepass "MinhaChave123@" -file upload_certificate.pem

      - name: Gerar AAB Oficial (Play Store)
        run: gradle bundleRelease --stacktrace

      - name: Disponibilizar AAB e Certificado
        uses: actions/upload-artifact@v4
        with:
          name: pacote-playstore-oficial
          path: |
            app/build/outputs/bundle/release/app-release.aab
            upload_certificate.pem
          retention-days: 14
