name: Compilar App Papinhas (AAB Play Store)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle Oficial
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Copia a chave padrão do runner para a pasta do app
      - name: Preparar Chave
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          cp ~/.android/debug.keystore app/release.keystore

      - name: Gerar AAB (Play Store)
        run: gradle bundleRelease --stacktrace

      - name: Disponibilizar AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: papinhas-sucos-aab-playstore
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
