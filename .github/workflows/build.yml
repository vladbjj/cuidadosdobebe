name: Compilar App Papinhas (AAB Oficial e APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle Oficial
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar Chave Oficial de Release (Keystore)
        run: |
          keytool -genkey -v -keystore app/release.keystore -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 -storepass "MinhaChave123@" -keypass "MinhaChave123@" -dname "CN=CuidadosDoBebe, OU=Apps, O=Bebe, L=SP, ST=SP, C=BR"

      - name: Gerar AAB Oficial (Play Store)
        run: gradle bundleRelease --stacktrace

      - name: Gerar APK (Para instalar no celular)
        run: gradle assembleRelease --stacktrace

      - name: Disponibilizar AAB Oficial (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: papinhas-sucos-aab-playstore-oficial
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Disponibilizar APK (Celular)
        uses: actions/upload-artifact@v4
        with:
          name: papinhas-sucos-apk-instalavel
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
