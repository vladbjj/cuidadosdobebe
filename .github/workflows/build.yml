name: Compilar App Papinhas (AAB e APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle Oficial
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar AAB (Play Store)
        run: gradle bundleRelease --stacktrace

      - name: Gerar APK (Instalar no Celular)
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: papinhas-sucos-aab-playstore
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Disponibilizar APK (Celular)
        uses: actions/upload-artifact@v4
        with:
          name: papinhas-sucos-apk-instalavel
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
